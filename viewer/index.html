<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLB2Print — 3D Viewer & Planar Cut</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1e1e24; color: #f3f4f6; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* UI Overlay Panel */
    #sidebar {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 340px;
      background: rgba(30, 30, 36, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    h2 { font-size: 1.1rem; font-weight: 700; color: #ffffff; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; }
    .subtitle { font-size: 0.78rem; color: #9ca3af; margin-bottom: 14px; }
    
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .info-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
      font-size: 0.8rem;
    }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .info-row:last-child { margin-bottom: 0; }
    .info-label { color: #9ca3af; }
    .info-val { font-weight: 600; color: #e5e7eb; }

    .section-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #38bdf8;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .axis-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: #d1d5db;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }
    .axis-btn:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
    .axis-btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.5);
    }

    .slider-container { margin-bottom: 14px; }
    .slider-header { display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 6px; }
    .slider-label { color: #9ca3af; }
    .slider-val { font-weight: 700; color: #38bdf8; font-family: monospace; font-size: 0.85rem; }

    input[type=range] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      -webkit-appearance: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #d1d5db;
      margin-bottom: 14px;
      cursor: pointer;
    }
    .checkbox-row input { cursor: pointer; accent-color: #2563eb; width: 14px; height: 14px; }

    .action-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-bottom: 8px;
    }
    .btn-split {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    .btn-split:hover { background: #1d4ed8; }
    .btn-split:disabled { background: #4b5563; cursor: not-allowed; opacity: 0.6; }

    .btn-center {
      background: rgba(255, 255, 255, 0.08);
      color: #e5e7eb;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.78rem;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-center:hover { background: rgba(255, 255, 255, 0.14); }

    /* Floating Status / Instructions Overlay */
    #instructions {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.75rem;
      color: #9ca3af;
      pointer-events: none;
    }

    #loading-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(30, 30, 36, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text" style="font-size: 0.95rem; font-weight: 600;">Loading 3D Model...</div>
  </div>

  <div id="canvas-container"></div>

  <div id="sidebar">
    <h2>
      <span id="model-name">Model</span>
      <span class="badge" id="model-badge">GLB</span>
    </h2>
    <div class="subtitle" id="model-stats">Calculating bounding box...</div>

    <div class="info-card">
      <div class="info-row">
        <span class="info-label">Bounding Box (X, Y, Z):</span>
        <span class="info-val" id="bounds-size">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Triangles / Vertices:</span>
        <span class="info-val" id="poly-count">-</span>
      </div>
    </div>

    <div class="section-title">
      <span>📐 Planar Cut Tool</span>
    </div>

    <div class="btn-group">
      <button class="axis-btn active" id="btn-axis-x" onclick="setCutAxis('X')">X (Left / Right)</button>
      <button class="axis-btn" id="btn-axis-y" onclick="setCutAxis('Y')">Y (Front / Back)</button>
      <button class="axis-btn" id="btn-axis-z" onclick="setCutAxis('Z')">Z (Top / Bottom)</button>
    </div>

    <div class="slider-container">
      <div class="slider-header">
        <span class="slider-label" id="slider-title">Plane Position (X):</span>
        <span class="slider-val" id="slider-val">0.00 mm</span>
      </div>
      <input type="range" id="cut-slider" min="-100" max="100" step="0.1" value="0" oninput="onSliderMove(this.value)">
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
      <button class="btn-center" onclick="centerPlane()">⌖ Center Cut Plane</button>
      <label class="checkbox-row" style="margin-bottom: 0;">
        <input type="checkbox" id="show-plane" checked onchange="togglePlane(this.checked)">
        <span>Show Plane</span>
      </label>
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="cap-cut" checked>
      <span>Cap Cut Faces (Watertight Solids)</span>
    </label>

    <button class="action-btn btn-split" id="btn-split" onclick="triggerSplit()">
      ✂ Split & Export Parts
    </button>
    <div id="split-status" style="font-size: 0.75rem; color: #9ca3af; text-align: center;"></div>
  </div>

  <div id="instructions">
    Left Click + Drag: Rotate &nbsp;|&nbsp; Right Click + Drag: Pan &nbsp;|&nbsp; Scroll: Zoom
  </div>

  <script src="/static/three.min.js"></script>
  <script src="/static/OrbitControls.js"></script>
  <script src="/static/GLTFLoader.js"></script>
  <script src="/static/meshopt_decoder.js"></script>

  <script>
    let scene, camera, renderer, controls;
    let model = null;
    let boundingBox = null;
    let cutPlaneMesh = null;
    let cutPlaneWire = null;
    let activeAxis = 'X';
    let currentCutCoord = 0;
    let modelBounds = { min: { x: 0, y: 0, z: 0 }, max: { x: 0, y: 0, z: 0 }, size: { x: 0, y: 0, z: 0 } };

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a20);

      // Camera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(2, 2, 3);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.7);
      dirLight1.position.set(5, 10, 7);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
      dirLight2.position.set(-5, -5, -5);
      scene.add(dirLight2);

      // Grid Floor
      const grid = new THREE.GridHelper(10, 50, 0x3b82f6, 0x334155);
      grid.position.y = -0.01;
      scene.add(grid);

      window.addEventListener('resize', onWindowResize);

      loadModel();
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function loadModel() {
      const loader = new THREE.GLTFLoader();
      if (typeof MeshoptDecoder !== 'undefined') {
        loader.setMeshoptDecoder(MeshoptDecoder);
      }

      loader.load('/api/model.glb', function (gltf) {
        model = gltf.scene;
        scene.add(model);

        // Compute Bounding Box
        boundingBox = new THREE.Box3().setFromObject(model);
        const center = new THREE.Vector3();
        boundingBox.getCenter(center);
        const size = new THREE.Vector3();
        boundingBox.getSize(size);

        modelBounds.min = boundingBox.min;
        modelBounds.max = boundingBox.max;
        modelBounds.size = size;

        // Count triangles
        let triCount = 0;
        let vertCount = 0;
        model.traverse(child => {
          if (child.isMesh && child.geometry) {
            vertCount += child.geometry.attributes.position.count;
            if (child.geometry.index) {
              triCount += child.geometry.index.count / 3;
            } else {
              triCount += child.geometry.attributes.position.count / 3;
            }
          }
        });

        document.getElementById('bounds-size').innerText = 
          `${(size.x * 1000).toFixed(1)} × ${(size.y * 1000).toFixed(1)} × ${(size.z * 1000).toFixed(1)} mm`;
        document.getElementById('poly-count').innerText = 
          `${triCount.toLocaleString()} triangles (${vertCount.toLocaleString()} verts)`;

        // Adjust camera to fit model
        const maxDim = Math.max(size.x, size.y, size.z);
        camera.position.set(center.x + maxDim * 1.5, center.y + maxDim * 1.2, center.z + maxDim * 1.8);
        controls.target.copy(center);
        controls.update();

        // Create Cutting Plane
        createCutPlane(size, center);

        setCutAxis('X');

        document.getElementById('loading-overlay').style.display = 'none';
      }, undefined, function (error) {
        console.error('Error loading model:', error);
        document.getElementById('loading-text').innerText = 'Error loading GLB model';
      });
    }

    function createCutPlane(size, center) {
      const planeSize = Math.max(size.x, size.y, size.z) * 1.6;
      const geom = new THREE.PlaneGeometry(planeSize, planeSize);
      
      const mat = new THREE.MeshBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.35,
        side: THREE.DoubleSide,
        depthWrite: false
      });

      cutPlaneMesh = new THREE.Mesh(geom, mat);

      const wireGeom = new THREE.EdgesGeometry(geom);
      const wireMat = new THREE.LineBasicMaterial({ color: 0x0284c7, linewidth: 2 });
      cutPlaneWire = new THREE.LineSegments(wireGeom, wireMat);
      cutPlaneMesh.add(cutPlaneWire);

      scene.add(cutPlaneMesh);
    }

    function setCutAxis(axis) {
      activeAxis = axis;
      document.getElementById('btn-axis-x').classList.toggle('active', axis === 'X');
      document.getElementById('btn-axis-y').classList.toggle('active', axis === 'Y');
      document.getElementById('btn-axis-z').classList.toggle('active', axis === 'Z');

      const slider = document.getElementById('cut-slider');
      const title = document.getElementById('slider-title');

      if (!boundingBox) return;

      let minVal, maxVal, midVal;
      if (axis === 'X') {
        minVal = boundingBox.min.x;
        maxVal = boundingBox.max.x;
        cutPlaneMesh.rotation.set(0, Math.PI / 2, 0); // Normal along X
      } else if (axis === 'Y') {
        minVal = boundingBox.min.y;
        maxVal = boundingBox.max.y;
        cutPlaneMesh.rotation.set(Math.PI / 2, 0, 0); // Normal along Y
      } else {
        minVal = boundingBox.min.z;
        maxVal = boundingBox.max.z;
        cutPlaneMesh.rotation.set(0, 0, 0); // Normal along Z
      }

      midVal = (minVal + maxVal) / 2.0;

      slider.min = minVal;
      slider.max = maxVal;
      slider.step = (maxVal - minVal) / 200.0;
      slider.value = midVal;

      title.innerText = `Plane Position (${axis}):`;
      onSliderMove(midVal);
    }

    function onSliderMove(val) {
      currentCutCoord = parseFloat(val);
      document.getElementById('slider-val').innerText = `${currentCutCoord.toFixed(3)}`;

      if (!cutPlaneMesh || !boundingBox) return;

      const center = new THREE.Vector3();
      boundingBox.getCenter(center);

      if (activeAxis === 'X') {
        cutPlaneMesh.position.set(currentCutCoord, center.y, center.z);
      } else if (activeAxis === 'Y') {
        cutPlaneMesh.position.set(center.x, currentCutCoord, center.z);
      } else {
        cutPlaneMesh.position.set(center.x, center.y, currentCutCoord);
      }
    }

    function centerPlane() {
      if (!boundingBox) return;
      let mid;
      if (activeAxis === 'X') mid = (boundingBox.min.x + boundingBox.max.x) / 2.0;
      else if (activeAxis === 'Y') mid = (boundingBox.min.y + boundingBox.max.y) / 2.0;
      else mid = (boundingBox.min.z + boundingBox.max.z) / 2.0;

      document.getElementById('cut-slider').value = mid;
      onSliderMove(mid);
    }

    function togglePlane(visible) {
      if (cutPlaneMesh) cutPlaneMesh.visible = visible;
    }

    function triggerSplit() {
      const btn = document.getElementById('btn-split');
      const status = document.getElementById('split-status');
      const capCut = document.getElementById('cap-cut').checked;

      btn.disabled = true;
      btn.innerText = '⏳ Bisecting & Exporting Parts...';
      status.innerText = 'Blender background engine bisecting mesh...';

      const payload = {
        axis: activeAxis.toLowerCase(),
        coord: currentCutCoord,
        cap_cut: capCut
      };

      fetch('/api/split', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(r => r.json())
      .then(res => {
        btn.disabled = false;
        btn.innerText = '✂ Split & Export Parts';
        if (res.success) {
          status.innerHTML = `<span style="color: #4ade80; font-weight: bold;">✔ Done! Parts exported to:</span><br>${res.output_folder}`;
          alert(`Successfully split model into 2 parts!\n\nExported to:\n${res.output_folder}`);
        } else {
          status.innerHTML = `<span style="color: #f87171;">Error: ${res.error || 'Split failed'}</span>`;
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerText = '✂ Split & Export Parts';
        status.innerHTML = `<span style="color: #f87171;">Network Error: ${err}</span>`;
      });
    }

    window.onload = init;
  </script>
</body>
</html>
